services:
  luna-science-api:
    build:
      context: .
      dockerfile: science_api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LUNA_DATA_DIR: /app/science_api/data
      LUNA_KERNEL_DIR: /app/science_api/kernels
      LUNA_MOON_FRAME: MOON_ME
    volumes:
      - ./science_api/data:/app/science_api/data
      - ./science_api/kernels:/app/science_api/kernels
    restart: unless-stopped

  luna-postgis:
    image: postgis/postgis:16-3.4
    profiles: ["database"]
    environment:
      POSTGRES_DB: luna
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: ${LUNA_POSTGRES_PASSWORD:?Set LUNA_POSTGRES_PASSWORD in your deployment environment}
    ports:
      - "5432:5432"
    volumes:
      - luna-postgis-data:/var/lib/postgresql/data
      - ./database/postgis_schema.sql:/docker-entrypoint-initdb.d/001_luna.sql:ro
    restart: unless-stopped

volumes:
  luna-postgis-data:
